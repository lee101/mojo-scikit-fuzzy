[project]
name = "mojo-scikit-fuzzy"
version = "0.1.0"
description = "Mojo-accelerated fuzzy c-means and Mamdani inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Passing more than 2 positional arguments:DeprecationWarning",
]
